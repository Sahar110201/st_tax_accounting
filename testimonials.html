<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonials Page</title>
</head>
<body>

<section id="testimonials">
  <h2>Client Testimonials</h2>

  <!-- List of testimonials -->
  <div id="testimonial-list">
    <!-- Existing testimonials will appear here -->
  </div>

  <!-- Form to add new testimonial -->
  <div class="testimonial-form">
    <h3>Add a Testimonial</h3>
    <form id="add-testimonial-form">
      <input type="text" id="clientName" name="clientName" placeholder="Client Name" required>
      <input type="text" id="clientDate" name="clientDate" placeholder="Date" required>
      <textarea id="clientFeedback" name="clientFeedback" rows="4" placeholder="Feedback" required></textarea>
      <button type="submit">Add Testimonial</button>
    </form>
  </div>
</section>
<script src="testimonial.js" defer></script>
</body>
</html>
